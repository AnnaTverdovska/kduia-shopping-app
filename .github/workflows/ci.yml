name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test -- --watchAll=false
        env:
          CI: true
      - name: Build (warnings count as errors)
        run: npm run build
        env:
          CI: true
